name: EAS Build — Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build (Android ${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails here rather than inside eas-cli, where a missing token surfaces as
      # an authentication error that reads like the token is wrong rather than
      # absent.
      - name: Check EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            echo "Generate one at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      # eas-cli is invoked directly rather than through expo/expo-github-action.
      # That action declares the node20 runtime, GitHub now runs actions on
      # Node 24, and its yarn-based install of eas-cli fails outright. EXPO_TOKEN
      # in the environment is all eas-cli needs to authenticate, so the action
      # was only ever saving us one line.
      #
      # Pinned to a major rather than `latest`: a build tool that silently
      # changes version between runs makes "it worked yesterday" unanswerable.
      - name: Build Android APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@^24.7.0 build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
